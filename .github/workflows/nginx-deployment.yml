name: Build and Push, and deploy nginx
on: [push]
permissions:
  id-token: write
  contents: read

jobs:
    Deploy-Nginx:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository code
              uses: actions/checkout@v4
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::882907016759:role/github-actions-artwork
                aws-region: eu-west-1
            - name: Sts GetCallerIdentity
              run: |
                aws sts get-caller-identity
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
            - name: Build Base Docker image
              run: |
                docker build -f docker/Dockerfile.nginx -t nginx:latest .
            - name: Tag Docker image
              run: |
                docker tag nginx:latest ${{ steps.login-ecr.outputs.registry }}/artwork/nginx:latest
            - name: Push Docker image to Amazon ECR
              run: |
                docker push ${{ steps.login-ecr.outputs.registry }}/artwork/nginx:latest
   