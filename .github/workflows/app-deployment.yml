name: Build and Push, and deploy app
on: [push]
permissions:
  id-token: write
  contents: read

jobs:
    Deploy-App:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository code
              uses: actions/checkout@v4
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::882907016759:role/github-actions-artwork
                aws-region: eu-west-1
            - name: Sts GetCallerIdentity
              run: |
                aws sts get-caller-identity
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
            - name: Build App image
              run: |
                docker build -f docker/Dockerfile -t artwork-app:latest .
            - name: Tag App Docker image
              run: |
                docker tag artwork-app:latest ${{ steps.login-ecr.outputs.registry }}/artwork/app:latest
            - name: Push App Docker image to Amazon ECR
              run: |
                docker push ${{ steps.login-ecr.outputs.registry }}/artwork/app:latest
            - name: Create temporary app container
              run: |
                docker create --name app-temp artwork-app:latest
            - name: Copy Build Assets From Container
              run: |
                docker cp app-temp:/var/www/public/build ./public/build
            - name: Remove temporary app container
              run: |
                docker rm app-temp
            - name: Build Nginx image
              run: |
                docker build -f docker/Dockerfile.nginx -t nginx:latest .
            - name: Tag Nginx Docker image
              run: |
                docker tag nginx:latest ${{ steps.login-ecr.outputs.registry }}/artwork/nginx:latest
            - name: Push Nginx Docker image to Amazon ECR
              run: |
                docker push ${{ steps.login-ecr.outputs.registry }}/artwork/nginx:latest
   
   